<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Jobs — March &amp; Lewis</title>
  <meta name="description" content="Browse open positions at March &amp; Lewis. Filter by type, industry, and location to find your next opportunity." />
  <link rel="stylesheet" href="/march-lewis/src/styles/main.css" />
</head>
<body id="jobs-page">
  <div id="header-placeholder"></div>

  <main>
    <section class="page-hero section-alt">
      <div class="container">
        <h1>Open Positions</h1>
        <p>Find your next career opportunity. Filter by type, location, or industry below.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="filters-placeholder"></div>
        <div class="grid" id="jobs-grid">
          <p class="loading">Loading positions…</p>
        </div>
      </div>
    </section>

    <section class="section-alt">
      <div class="container" style="text-align:center;">
        <h2>Don't See a Fit?</h2>
        <p>Submit your profile and we'll match you when the right role opens up.</p>
        <a href="/march-lewis/candidate-onboarding.html" class="btn btn-primary">Create Candidate Profile</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/march-lewis/src/pages/jobs.js"></script>
</body>
</html>
