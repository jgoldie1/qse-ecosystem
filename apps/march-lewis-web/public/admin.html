<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>March &amp; Lewis Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">March &amp; Lewis Admin</div>
      <nav class="nav">
        <a href="/march-lewis">← Back to Site</a>
        <button class="btn btn-outline" id="logoutBtn">Logout</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="section container">
      <h2>Admin Login</h2>
      <form class="form" id="adminLoginForm">
        <input type="email" name="email" placeholder="Admin Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" class="btn btn-primary">Login</button>
        <p id="adminLoginResult" class="form-status"></p>
      </form>
      <div id="sessionStatus" style="margin-top: 12px; text-align: center; color: var(--text-muted);"></div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <h2>Dashboard</h2>
        <div class="grid" id="adminStats"></div>
        <div class="grid" style="margin-top: 20px;" id="adminLatest"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 March &amp; Lewis &mdash; <a href="/">QSE Ecosystem</a></p>
    </div>
  </footer>

  <script src="assets/js/admin.js"></script>
</body>
</html>
