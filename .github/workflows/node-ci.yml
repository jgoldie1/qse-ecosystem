name: Node CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show current branch
        run: git branch --show-current
      - name: Show remotes
        run: git remote -v
      - name: Show git status
        run: git status
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node -e "console.log('CI check passed')"
